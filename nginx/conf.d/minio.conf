# Определяем upstream-группу для MinIO кластера из 5 узлов.
# Используем алгоритм балансировки least_conn (минимум активных соединений).
upstream minio_cluster {
    least_conn;  # балансировка: новый запрос к серверу с наименьшим числом активных соединений
    server 10.210.0.67:9000 max_fails=3 fail_timeout=30s;
    server 10.210.0.68:9000 max_fails=3 fail_timeout=30s;
    server 10.210.0.69:9000 max_fails=3 fail_timeout=30s;
    server 10.210.0.70:9000 max_fails=3 fail_timeout=30s;
    server 10.210.0.71:9000 max_fails=3 fail_timeout=30s;
    # Пять адресов соответствуют узлам MinIO, порт 9000 – порт MinIO S3 API.
    # Параметры max_fails/fail_timeout задают поведение при недоступности узла.
}

server {
    listen       19000 default_server;
    listen       19443 ssl;

    server_name  _;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    client_max_body_size 0;
    client_body_buffer_size 128k;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout  300;
    proxy_send_timeout     300;
    proxy_read_timeout     300;

    location / {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $content_type;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        chunked_transfer_encoding off;

        # proxy_ssl_verify off;  # <--- ВАЖНО: не проверять self-signed backend cert
        proxy_pass https://minio_cluster;
    }
}

server {
    listen       19444 ssl;

    server_name  _;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    client_max_body_size 0;
    client_body_buffer_size 128k;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout  300;
    proxy_send_timeout     300;
    proxy_read_timeout     300;

    location / {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Content-Type      $content_type;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        chunked_transfer_encoding off;

        # Включаем кеширование
        proxy_cache S3-cache;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;

        proxy_cache_convert_head off;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$request_method$request_uri$is_args$args";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_revalidate on;

        add_header Cache-Control max-age=31536000;
        add_header X-Cache-Status $upstream_cache_status;


        # proxy_ssl_verify off;  # <--- ВАЖНО: не проверять self-signed backend cert
        proxy_pass https://minio_cluster;
    }
}
