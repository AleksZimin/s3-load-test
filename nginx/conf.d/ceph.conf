# ========= GLOBAL PROXY_CACHE ==========
proxy_cache_path /var/cache/nginx/ceph_s3_cache levels=1:2 keys_zone=ceph-s3-cache:2048m inactive=240h max_size=60g;

# --- map-флаги для пропуска кэша при Range / Authorization
# map $http_range        $skip_cache_range { "" 0; default 1; }
# map $http_authorization $skip_cache_auth  { "" 0; default 1; }
# map $http_authorization $auth_upstream    { "" ""; default $http_authorization; }

map $http_range $bypass_range_cache {
    ""       0;  # обычный запрос — кешировать
    default  1;  # с Range — не кешировать
}

# ========= UPSTREAM CLUSTER ==========
upstream ceph_cluster {
    least_conn;
    keepalive 200;
    # server 10.210.0.67:9000 max_fails=3 fail_timeout=30s;
    # server 10.210.0.68:9000 max_fails=3 fail_timeout=30s;
    # server 10.210.0.69:9000 max_fails=3 fail_timeout=30s;
    # server 10.210.0.70:9000 max_fails=3 fail_timeout=30s;
    # server 10.210.0.71:9000 max_fails=3 fail_timeout=30s;
    # server 10.210.0.67:9001 max_fails=3 fail_timeout=30s;
    # server 10.210.0.68:9001 max_fails=3 fail_timeout=30s;
    # server 10.210.0.69:9001 max_fails=3 fail_timeout=30s;
    # server 10.210.0.70:9001 max_fails=3 fail_timeout=30s;
    # server 10.210.0.71:9001 max_fails=3 fail_timeout=30s;
    server 127.0.1:9000 max_fails=3 fail_timeout=30s;
    server 127.0.1:9001 max_fails=3 fail_timeout=30s;
}

# ========= SERVER WITHOUT CACHE ==========
server {
    listen 20000 default_server;
    listen 20443 ssl http2;
    # http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;

    location / {
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";
        chunked_transfer_encoding off;

        # proxy_ssl_verify off;
        proxy_pass http://ceph_cluster;
    }
}

# ========= SERVER WITH CACHE ON 19444 ==========
server {
    listen 20444 ssl http2;
    # http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_connect_timeout 300;
    proxy_send_timeout    300;
    proxy_read_timeout    300;

    location / {
        proxy_http_version 1.1;
        keepalive_timeout  65;

        # Отключаем автоматическую передачу заголовков
        proxy_pass_request_headers off;

        # Явно пробрасываем только заголовки, участвующие в Sig‑V4
        proxy_set_header Host                  $http_host;
        proxy_set_header Range                 $http_range;
        proxy_set_header Authorization         $http_authorization;
        proxy_set_header Accept-Encoding       $http_accept_encoding;
        proxy_set_header Amz-Sdk-Invocation-Id $http_amz_sdk_invocation_id;
        proxy_set_header Amz-Sdk-Request       $http_amz_sdk_request;
        proxy_set_header X-Amz-Checksum-Mode   $http_x_amz_checksum_mode;
        proxy_set_header X-Amz-Content-Sha256  $http_x_amz_content_sha256;
        proxy_set_header X-Amz-Date            $http_x_amz_date;
        proxy_set_header Connection            "";
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match     "";
        proxy_set_header If-Range          "";

        chunked_transfer_encoding off;

        # Настройки кэша
        proxy_cache       ceph-s3-cache;
        proxy_cache_key   "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_convert_head off;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 206 0;
        proxy_cache_valid 400 0;
        proxy_cache_valid 408 0;
        proxy_cache_valid 500 0;
        proxy_cache_valid 502 0;
        proxy_cache_valid 503 0;
        proxy_cache_valid 504 0;
        # proxy_cache_valid any 60m;
        proxy_cache_min_uses 1;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;

        proxy_no_cache     $bypass_range_cache;
        proxy_cache_bypass $bypass_range_cache;

        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control  max-age=31536000;

        proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
        proxy_hide_header   Set-Cookie;
        proxy_hide_header   Cache-Control;
        proxy_hide_header   Vary;

        proxy_ssl_verify off;
        proxy_pass http://ceph_cluster;
    }
}
